<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>D'TAY89 Remote Control Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { color: #00bcd4; text-align: center; }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 8px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .btn-row { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-play { background: #4caf50; color: white; }
        .btn-pause { background: #ff9800; color: white; }
        .btn-buy { background: #2196f3; color: white; }
        .btn-sell { background: #f44336; color: white; }
        .status-box { margin-top: 20px; background: #2d2d2d; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <h2>D'TAY89 Remote Dashboard</h2>
    
    <div class="control-group">
        <label>Strategy:</label>
        <select id="strategySelect" onchange="updateSettings()">
            <option value="PURE_EXECUTION" {% if state.strategy == 'PURE_EXECUTION' %}selected{% endif %}>Pure Execution (M15 Rules)</option>
            <option value="SUPPORT_RESISTANCE" {% if state.strategy == 'SUPPORT_RESISTANCE' %}selected{% endif %}>Support & Resistance</option>
        </select>
    </div>

    <div class="control-group">
        <label>Timeframe:</label>
        <select id="timeframeSelect" onchange="updateSettings()">
            <option value="M1" {% if state.timeframe == 'M1' %}selected{% endif %}>M1</option>
            <option value="M5" {% if state.timeframe == 'M5' %}selected{% endif %}>M5</option>
            <option value="M15" {% if state.timeframe == 'M15' %}selected{% endif %}>M15</option>
            <option value="M30" {% if state.timeframe == 'M30' %}selected{% endif %}>M30</option>
            <option value="H1" {% if state.timeframe == 'H1' %}selected{% endif %}>H1</option>
            <option value="H4" {% if state.timeframe == 'H4' %}selected{% endif %}>H4</option>
            <option value="D1" {% if state.timeframe == 'D1' %}selected{% endif %}>D1</option>
        </select>
    </div>

    <div class="control-group">
        <label>Lot Size:</label>
        <input type="number" step="0.01" id="lotSizeInput" value="{{ state.lotSize }}" onchange="updateSettings()">
    </div>

    <div class="control-group">
        <label>Max Trades:</label>
        <input type="number" id="maxTradesInput" value="{{ state.maxTrades }}" onchange="updateSettings()">
    </div>

    <div class="btn-row">
        <button class="btn-play" onclick="sendControl('PLAY')">PLAY</button>
        <button class="btn-pause" onclick="sendControl('PAUSE')">PAUSE</button>
    </div>

    <div class="btn-row">
        <button class="btn-buy" onclick="sendControl('MANUAL_BUY')">FORCE BUY</button>
        <button class="btn-sell" onclick="sendControl('MANUAL_SELL')">FORCE SELL</button>
    </div>

    <div class="status-box">
        <p><strong>Engine State:</strong> <span id="statusEnabled">{{ state.enabled }}</span></p>
        <p><strong>Last Executed:</strong> <span id="statusLast">{{ state.lastExecuted }}</span></p>
    </div>
</div>

<script>
    function sendControl(command) {
        fetch('/api/control', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pair: 'DTAY89', command: command })
        }).then(res => res.json()).then(data => {
            document.getElementById('statusEnabled').innerText = data.state.enabled;
            document.getElementById('statusLast').innerText = data.state.lastExecuted;
        });
    }

    function updateSettings() {
        const strategy = document.getElementById('strategySelect').value;
        const timeframe = document.getElementById('timeframeSelect').value;
        const lotSize = parseFloat(document.getElementById('lotSizeInput').value);
        const maxTrades = parseInt(document.getElementById('maxTradesInput').value);

        fetch('/api/control', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                pair: 'DTAY89',
                strategy: strategy,
                timeframe: timeframe,
                lotSize: lotSize,
                maxTrades: maxTrades
            })
        });
    }
</script>
</body>
</html>
